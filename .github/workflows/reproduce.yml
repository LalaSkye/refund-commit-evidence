name: Reproduce refund test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Replay and hash output
        shell: bash
        run: |
          set +e
          python tools/reproduce.py > reproduction-output.txt 2>&1
          status=$?
          cat reproduction-output.txt
          python -c "import hashlib, pathlib; p = pathlib.Path('reproduction-output.txt'); print(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name)" > reproduction-output.sha256
          hash_status=$?
          if [ "$hash_status" -ne 0 ]; then exit "$hash_status"; fi
          exit "$status"
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: refund-replay-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            reproduction-output.txt
            reproduction-output.sha256
          if-no-files-found: error
